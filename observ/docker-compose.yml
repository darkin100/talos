name: talos

networks:
  talos-net:
    driver: bridge

volumes:
  phoenix-data:
  app-logs:

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: talos-phoenix
    restart: unless-stopped
    networks: [talos-net]
    ports:
      - "6006:6006"   # Phoenix UI + REST
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      # The Phoenix image has python3 but no shell, curl or wget — use stdlib.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6006/').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  todo-api:
    image: talos/todo:v1
    container_name: talos-todo
    build:
      context: ../hello-world
    restart: unless-stopped
    networks: [talos-net]
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:4317
      OTEL_SERVICE_NAME: todo-api
    depends_on:
      phoenix:
        condition: service_healthy
    # No in-container healthcheck: the distroless image has no shell or curl.
    # The deploy script polls /healthz over the network instead.
