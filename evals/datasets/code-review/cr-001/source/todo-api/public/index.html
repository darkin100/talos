<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    .todo-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hidden {
      display: none;
    }

    input.edit-title {
      font-size: 1rem;
    }
  </style>
  <script>
    function toggleEditMode(todoId) {
      const titleElement = document.getElementById(`title-${todoId}`);
      const inputElement = document.getElementById(`input-${todoId}`);

      if (titleElement.classList.contains('hidden')) {
        titleElement.classList.remove('hidden');
        inputElement.classList.add('hidden');
      } else {
        titleElement.classList.add('hidden');
        inputElement.classList.remove('hidden');
        inputElement.value = titleElement.textContent;
        inputElement.focus();
      }
    }

    async function saveTitle(todoId) {
      const inputElement = document.getElementById(`input-${todoId}`);
      const titleElement = document.getElementById(`title-${todoId}`);
      const newTitle = inputElement.value;

      const oldTitle = titleElement.textContent;
      titleElement.textContent = newTitle;
      toggleEditMode(todoId);

      try {
        const response = await fetch(`/api/todos/${todoId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ title: newTitle })
        });

        if (!response.ok) {
          throw new Error('Failed to save title');
        }
      } catch (error) {
        titleElement.textContent = oldTitle;
        alert(`Failed to update todo title: ${error.message}`);
      }
    }

    function handleInputKeyPress(event, todoId) {
      if (event.key === 'Enter') {
        saveTitle(todoId);
      } else if (event.key === 'Escape') {
        toggleEditMode(todoId);
      }
    }
  </script>
</head>
<body>
  <h1>Todo List</h1>
  <div id="todo-list">
    <div class="todo-item" data-todo-id="1">
      <button onclick="toggleEditMode(1)">🖉</button>
      <span id="title-1" onclick="toggleEditMode(1)">Example Todo</span>
      <input id="input-1" class="edit-title hidden" type="text" value="Example Todo"
             onblur="toggleEditMode(1)" onkeydown="handleInputKeyPress(event, 1)">
    </div>
  </div>
</body>
</html>
