name: Talos SDLC

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.summary.outputs.verdict }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build agent images
        run: |
          docker build -t talos/code-review:v1 ./agents/code-review
          docker build -t talos/security-review:v1 ./agents/security-review

      - name: Run code-review agent
        id: code_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PR_NUMBER=${{ github.event.pull_request.number }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            talos/code-review:v1

      - name: Run security-review agent
        id: security_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PR_NUMBER=${{ github.event.pull_request.number }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            talos/security-review:v1

      - name: Summarise
        id: summary
        run: echo "verdict=pass" >> "$GITHUB_OUTPUT"

  auto-merge:
    needs: pr-review
    if: github.event_name == 'pull_request' && needs.pr-review.outputs.verdict == 'pass'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        env:
          # Use a PAT (not GITHUB_TOKEN) so the resulting push to main triggers
          # the deploy-and-verify workflow run. GitHub suppresses workflow runs
          # for pushes authored by the default GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.TALOS_CI_TOKEN }}
        run: gh pr merge ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --squash --auto

  deploy-and-verify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Build agent images
        run: |
          docker build -t talos/release-notes:v1 ./agents/release-notes
          docker build -t talos/rca:v1 ./agents/rca

      - name: Run Todo API tests
        working-directory: todo-api
        run: npm test

      - name: Pull Vercel project config
        working-directory: todo-api
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        working-directory: todo-api
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        working-directory: todo-api
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Smoke deployment
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          healthy=false
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/healthz"; then
              echo "todo-api is up at $URL"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "todo-api never became healthy at $URL after 60s" >&2
            exit 1
          fi
          curl -fsS -X POST "$URL/api/todos" -H 'content-type: application/json' -d '{"title":"demo"}'
          curl -fsS "$URL/api/todos"

      - name: Resolve merged PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --repo ${{ github.repository }} --state merged --search "${{ github.sha }}" --json number --jq '.[0].number // empty')
          echo "number=${PR}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PR_NUMBER=${{ steps.pr.outputs.number }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            talos/release-notes:v1

      - name: Capture Vercel logs
        run: |
          mkdir -p .logs
          vercel logs ${{ steps.deploy.outputs.url }} --token=${{ secrets.VERCEL_TOKEN }} > .logs/app.log 2>&1 || true

      - name: Run RCA agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PHOENIX_URL: ${{ secrets.PHOENIX_URL }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/todo-api:/workspace:ro" \
            -v "${{ github.workspace }}/.logs:/logs:ro" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e OPENROUTER_API_KEY \
            -e PHOENIX_URL \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            -e COMMIT_SHA=${{ github.sha }} \
            -e PR_NUMBER=${{ steps.pr.outputs.number }} \
            -e DEPLOYMENT_URL=${{ steps.deploy.outputs.url }} \
            talos/rca:v1
