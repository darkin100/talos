name: Talos SDLC

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
  # PRs opened by the code agent's GITHUB_TOKEN don't fire `pull_request`
  # (GitHub's loop-prevention). The agent emits this dispatch instead, with
  # `client_payload.pr_number` carrying the PR to review.
  repository_dispatch:
    types: [talos-pr-ready]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pr-review:
    if: github.event_name == 'pull_request' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the PR number across both trigger types.
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # When the SDLC is woken via repository_dispatch, the default
          # checkout lands on the dispatch ref (main). Pull the PR head so
          # security-review (which bind-mounts the workspace) sees the
          # actual changes under review.
          ref: ${{ github.event_name == 'repository_dispatch' && format('refs/pull/{0}/head', env.PR_NUMBER) || '' }}

      - name: Build agent images
        run: |
          docker build -t talos/code-review:v1 ./agents/code-review
          docker build -t talos/security-review:v1 ./agents/security-review

      - name: Run code-review agent
        id: code_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PR_NUMBER=${{ env.PR_NUMBER }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            talos/code-review:v1

      - name: Run security-review agent
        id: security_review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PR_NUMBER=${{ env.PR_NUMBER }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            talos/security-review:v1

  auto-merge:
    needs: pr-review
    if: github.event_name == 'pull_request' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        env:
          # Use a PAT (not GITHUB_TOKEN) so the resulting push to main triggers
          # the deploy-and-verify workflow run. GitHub suppresses workflow runs
          # for pushes authored by the default GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.TALOS_CI_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr_number }}
        run: gh pr merge ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --squash --auto

  # --- Deploy & verify pipeline -------------------------------------------
  # Split into stages so the run shows up as a job graph in the GitHub UI:
  #
  #   test → deploy → smoke → {release-notes, contract-test} → promote → rca
  #
  # Each job runs on a fresh runner, so agent images are built in the job
  # that uses them and data (preview URL, merged PR number) flows through
  # job outputs. Only `test` carries the trigger condition; everything
  # downstream inherits it through `needs`.

  test:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Todo API tests
        working-directory: todo-api
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      pr_number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project config
        working-directory: todo-api
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        working-directory: todo-api
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        working-directory: todo-api
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to preview: $URL"

      # Publish the preview URL as a commit comment immediately so external
      # tooling (eval harness, incident seeding) can find the live deployment
      # while this run is still in progress — the CLI deployment does not
      # register in the GitHub Deployments API.
      - name: Publish preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
            -f body="talos-preview: ${{ steps.deploy.outputs.url }}" || true

      - name: Resolve merged PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --repo ${{ github.repository }} --state merged --search "${{ github.sha }}" --json number --jq '.[0].number // empty')
          echo "number=${PR}" >> "$GITHUB_OUTPUT"

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke deployment
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          healthy=false
          for i in $(seq 1 30); do
            if curl -fsS "$URL/api/healthz"; then
              echo "todo-api is up at $URL"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "todo-api never became healthy at $URL after 60s" >&2
            exit 1
          fi
          curl -fsS -X POST "$URL/api/todos" -H 'content-type: application/json' -d '{"title":"demo"}'
          curl -fsS "$URL/api/todos"
          # The home page is part of the deployment too — a wrong Root Directory
          # ships an empty site that 404s on "/" while every /api route still
          # works, so the API-only checks above pass and the break is invisible.
          # Assert the static UI is actually served (must return the app shell).
          root=$(curl -fsS "$URL/") || { echo 'home page / did not return 200 at '"$URL" >&2; exit 1; }
          echo "$root" | grep -q '<title>Talos Todo</title>' \
            || { echo 'home page / returned 200 but did not serve the Todo UI at '"$URL" >&2; exit 1; }
          echo "home page is served at $URL/"

  release-notes:
    needs: [deploy, smoke]
    # Pushes without a merged PR (e.g. direct commits) have nothing to write
    # notes for; the job is skipped rather than failed so promote can proceed.
    if: needs.deploy.outputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -t talos/release-notes:v1 ./agents/release-notes

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
          RELEASE_TAG: v${{ github.run_number }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e PR_NUMBER=${{ needs.deploy.outputs.pr_number }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            -e RELEASE_TAG \
            talos/release-notes:v1

  contract-test:
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build agent image
        run: docker build -t talos/contract-test:v1 ./agents/contract-test

      - name: Run contract-test agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/todo-api:/workspace:ro" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e OPENROUTER_API_KEY \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            -e DEPLOYMENT_URL=${{ needs.deploy.outputs.url }} \
            -e COMMIT_SHA=${{ github.sha }} \
            -e PR_NUMBER=${{ needs.deploy.outputs.pr_number }} \
            talos/contract-test:v1

  promote:
    needs: [deploy, release-notes, contract-test]
    # Gating: release-notes may legitimately be SKIPPED (direct push with no
    # merged PR), and a job's implicit `if: success()` treats a skipped need
    # as a blocker — without an explicit condition, promote would silently
    # never run on direct pushes. `!failure() && !cancelled()` runs promote
    # unless something in the dependency chain actually FAILED or the run was
    # cancelled; skipped jobs pass through. Net effect, identical to the old
    # monolithic job: a failed release-notes or contract-test blocks
    # promotion, a skipped release-notes does not. Equivalent explicit form:
    #   needs.contract-test.result == 'success' &&
    #   (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped')
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    env:
      # Project linkage without a checkout: the monolithic job ran promote
      # from todo-api/ and relied on the .vercel directory that `vercel pull`
      # had created earlier in the same job. This job has neither, by design.
      # Setting VERCEL_ORG_ID + VERCEL_PROJECT_ID is the documented CI
      # mechanism for the Vercel CLI to resolve the project without a linked
      # directory, and `vercel promote` is passed the full deployment URL
      # (plus --scope), which identifies the deployment unambiguously.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Promote to production
        run: |
          vercel promote ${{ needs.deploy.outputs.url }} --yes --scope=${{ secrets.VERCEL_ORG_ID }} --token=${{ secrets.VERCEL_TOKEN }}
          echo "Promoted ${{ needs.deploy.outputs.url }} to production"

  rca:
    needs: [deploy, promote]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Build agent image
        run: docker build -t talos/rca:v1 ./agents/rca

      # PRD: RCA "monitors logs for 60 seconds (configurable) after
      # deployment". Capturing seconds after deploy meant RCA could only
      # ever see smoke-test traffic and would never catch a production
      # incident. Promote re-aliases the same deployment, so its runtime
      # logs keep accumulating — soak, then capture.
      - name: Soak for production traffic
        run: sleep 75

      - name: Capture Vercel logs
        run: |
          mkdir -p .logs
          vercel logs ${{ needs.deploy.outputs.url }} --json --token=${{ secrets.VERCEL_TOKEN }} > .logs/app.log 2>&1 || true

      # Persist the log bundle so eval datasets (RCA replay tasks in
      # evals/datasets/rca/) can be harvested from any run after the fact.
      - name: Upload log bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-logs-${{ github.run_id }}
          path: .logs/app.log
          retention-days: 30
          if-no-files-found: warn

      - name: Run RCA agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PHOENIX_URL: ${{ secrets.PHOENIX_URL }}
          ARIZE_SPACE_ID: ${{ secrets.ARIZE_SPACE_ID }}
          ARIZE_API_KEY: ${{ secrets.ARIZE_API_KEY }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/todo-api:/workspace:ro" \
            -v "${{ github.workspace }}/.logs:/logs:ro" \
            -e GITHUB_TOKEN \
            -e GITHUB_REPOSITORY=${{ github.repository }} \
            -e OPENROUTER_API_KEY \
            -e PHOENIX_URL \
            -e ARIZE_SPACE_ID \
            -e ARIZE_API_KEY \
            -e COMMIT_SHA=${{ github.sha }} \
            -e PR_NUMBER=${{ needs.deploy.outputs.pr_number }} \
            -e DEPLOYMENT_URL=${{ needs.deploy.outputs.url }} \
            talos/rca:v1
